<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google Classroom</title>
    <link rel="icon" type="image/svg+xml" href="https://www.gstatic.com/classroom/logo_square_rounded.svg">
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- PeerJS -->
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <!-- Clean Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { 
            font-family: 'Poppins', sans-serif; 
            background-color: #0b0f19;
            color: #e2e8f0;
        }
        
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.2); border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(255, 255, 255, 0.4); }

        .glass-panel {
            background: rgba(17, 24, 39, 0.65);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
    </style>
</head>
<body class="h-screen w-screen flex flex-col overflow-hidden relative">

    <!-- Flying Starfield Background -->
    <canvas id="starfield" class="absolute inset-0 z-0 pointer-events-none"></canvas>

    <!-- App Container -->
    <div class="relative z-10 flex flex-col h-full w-full">
        
        <!-- Single Clean Header -->
        <header class="glass-panel px-6 py-3.5 flex justify-between items-center shadow-md">
            <div class="flex items-center space-x-3">
                <span class="font-bold text-white text-lg tracking-wide bg-gradient-to-r from-blue-400 to-purple-400 bg-clip-text text-transparent">FalconChat</span>
            </div>
            <div id="connection-status" class="flex items-center space-x-2 text-sm font-medium">
                <span class="w-2.5 h-2.5 rounded-full bg-gray-500" id="status-dot"></span>
                <span id="status-text" class="text-gray-400">Disconnected</span>
            </div>
        </header>

        <!-- Main Content Area -->
        <main class="flex-1 flex overflow-hidden relative">

            <!-- ================= LOBBY VIEW ================= -->
            <div id="lobby-view" class="m-auto max-w-md w-full p-8 glass-panel rounded-3xl shadow-2xl space-y-6">
                <div class="text-center space-y-1">
                    <h1 class="text-2xl font-bold text-white tracking-wide">Welcome</h1>
                    <p class="text-gray-400 text-sm">Join the public room or enter a private room code.</p>
                </div>

                <div class="space-y-4 pt-2">
                    <div>
                        <label class="block text-xs font-semibold uppercase tracking-wider text-gray-400 mb-1.5">Your Name</label>
                        <input type="text" id="username-input" placeholder="e.g. Alex" class="w-full bg-black/40 border border-white/10 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-purple-500 transition shadow-inner">
                    </div>

                    <button onclick="joinServer('public-hub')" class="w-full bg-gradient-to-r from-blue-600 to-purple-600 hover:from-blue-500 hover:to-purple-500 text-white font-semibold py-3.5 rounded-xl transition shadow-lg shadow-purple-500/25">
                        Join Public Room
                    </button>

                    <div class="relative flex py-2 items-center">
                        <div class="flex-grow border-t border-white/10"></div>
                        <span class="flex-shrink mx-4 text-gray-500 text-xs font-medium uppercase">Or</span>
                        <div class="flex-grow border-t border-white/10"></div>
                    </div>

                    <div class="grid grid-cols-3 gap-3">
                        <input type="text" id="room-code-input" placeholder="Room Code" class="col-span-2 bg-black/40 border border-white/10 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-purple-500 transition shadow-inner uppercase">
                        <input type="number" id="room-capacity" placeholder="Max" value="10" min="2" max="50" class="col-span-1 bg-black/40 border border-white/10 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-purple-500 transition shadow-inner">
                    </div>

                    <button onclick="joinPrivateRoom()" class="w-full bg-white/5 hover:bg-white/10 text-white border border-white/20 font-semibold py-3 rounded-xl transition">
                        Join Private Room
                    </button>
                </div>
            </div>

            <!-- ================= CHAT VIEW ================= -->
            <div id="chat-view" class="hidden flex-1 w-full h-full flex">
                
                <!-- Sidebar -->
                <aside class="w-64 glass-panel border-r border-white/5 flex flex-col z-10">
                    <div class="p-4 border-b border-white/5 flex justify-between items-center bg-black/20">
                        <h2 id="current-room-title" class="font-semibold text-white truncate max-w-[120px]">Public</h2>
                        <button onclick="leaveRoom()" class="text-xs bg-red-500/20 text-red-300 hover:bg-red-500/40 hover:text-white px-3 py-1.5 rounded-lg font-medium transition">Leave</button>
                    </div>
                    <div class="p-4 flex-1 overflow-y-auto space-y-3">
                        <h3 class="text-xs font-semibold uppercase tracking-wider text-gray-400 mb-2">Online Users</h3>
                        <div id="peer-list" class="space-y-2">
                            <!-- Populated dynamically -->
                        </div>
                    </div>
                </aside>

                <!-- Chat Panel -->
                <div class="flex-1 flex flex-col relative bg-black/20 backdrop-blur-sm z-10">
                    
                    <!-- Video Grid container -->
                    <div id="video-grid-container" class="hidden bg-black/40 border-b border-white/10 p-4 max-h-64 overflow-y-auto">
                        <div id="video-grid" class="flex gap-4 overflow-x-auto pb-2 snap-x"></div>
                    </div>

                    <!-- Messages Stream -->
                    <div id="message-container" class="flex-1 p-6 overflow-y-auto space-y-5"></div>

                    <!-- Input Bar -->
                    <div class="p-4 glass-panel border-t border-white/5">
                        <form id="chat-form" onsubmit="handleSendText(event)" class="flex items-center space-x-3">
                            <button type="button" id="video-btn" onclick="toggleVideo()" class="bg-white/10 hover:bg-white/20 p-3 rounded-xl border border-white/10 transition text-gray-300 hover:text-white" title="Toggle Camera">
                                📷
                            </button>
                            <label class="cursor-pointer bg-white/10 hover:bg-white/20 p-3 rounded-xl border border-white/10 transition text-gray-300 hover:text-white" title="Send Image">
                                🖼️
                                <input type="file" id="image-input" accept="image/*" class="hidden" onchange="previewImage(event)">
                            </label>
                            <input type="text" id="message-input" placeholder="Type a message..." autocomplete="off" class="flex-1 bg-black/40 border border-white/10 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-purple-500 transition shadow-inner">
                            <button type="submit" class="bg-gradient-to-r from-blue-600 to-purple-600 hover:from-blue-500 hover:to-purple-500 text-white px-6 py-3 rounded-xl font-semibold transition shadow-lg shadow-purple-500/25">
                                Send
                            </button>
                        </form>
                    </div>
                </div>
            </div>
        </main>

        <!-- Image Preview Modal -->
        <div id="image-modal" class="hidden absolute inset-0 bg-black/80 backdrop-blur-md z-50 flex items-center justify-center p-4">
            <div class="glass-panel rounded-3xl p-6 max-w-md w-full space-y-4 shadow-2xl">
                <div class="flex justify-between items-center border-b border-white/10 pb-3">
                    <h3 class="font-semibold text-lg text-white">Send Image</h3>
                    <button onclick="closeImageModal()" class="text-gray-400 hover:text-white text-2xl leading-none">&times;</button>
                </div>
                <div class="bg-black/50 border border-white/10 rounded-2xl max-h-64 flex items-center justify-center p-2 overflow-hidden">
                    <img id="modal-img-preview" class="max-h-64 object-contain rounded-xl">
                </div>
                <input type="text" id="image-caption-input" placeholder="Add a caption..." class="w-full bg-black/40 border border-white/10 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-purple-500 transition text-sm">
                <div class="flex space-x-3 pt-2">
                    <button onclick="closeImageModal()" class="flex-1 bg-white/5 hover:bg-white/10 text-white font-semibold py-3 rounded-xl transition">Cancel</button>
                    <button onclick="handleSendImage()" class="flex-1 bg-gradient-to-r from-blue-600 to-purple-600 hover:from-blue-500 hover:to-purple-500 text-white font-semibold py-3 rounded-xl transition shadow-lg shadow-purple-500/25">Send</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Script -->
    <script>
        // Flying Starfield Galaxy Background
        const canvas = document.getElementById('starfield');
        const ctx = canvas.getContext('2d');
        let stars = [];
        const numStars = 350;

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        class Star {
            constructor() { this.reset(); }
            reset() {
                this.x = (Math.random() - 0.5) * canvas.width * 2;
                this.y = (Math.random() - 0.5) * canvas.height * 2;
                this.z = Math.random() * canvas.width;
                this.pz = this.z;
            }
            update() {
                this.z -= 2.5;
                if (this.z < 1) {
                    this.reset();
                    this.z = canvas.width;
                }
            }
            draw() {
                let sx = (this.x / this.z) * canvas.width + canvas.width / 2;
                let sy = (this.y / this.z) * canvas.height + canvas.height / 2;
                let px = (this.x / this.pz) * canvas.width + canvas.width / 2;
                let py = (this.y / this.pz) * canvas.height + canvas.height / 2;
                
                this.pz = this.z;

                ctx.beginPath();
                ctx.moveTo(px, py);
                ctx.lineTo(sx, sy);
                ctx.lineWidth = (1 - this.z / canvas.width) * 2.5;
                ctx.strokeStyle = `rgba(255, 255, 255, ${1 - this.z / canvas.width})`;
                ctx.stroke();
            }
        }

        for (let i = 0; i < numStars; i++) stars.push(new Star());

        function animateStars() {
            ctx.fillStyle = 'rgba(11, 15, 25, 0.35)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            stars.forEach(star => { star.update(); star.draw(); });
            requestAnimationFrame(animateStars);
        }
        animateStars();

        // Chat Application Logic
        let peer = null;
        let connections = {}; 
        let myUsername = '';
        let roomCode = '';
        let isHost = false;
        let hostConnection = null;
        let stagedImageBase64 = null;
        let participantNames = {}; 
        let localStream = null;
        let activeCalls = {};

        const peerConfig = {
            config: {
                iceServers: [
                    { urls: 'stun:stun.l.google.com:19302' },
                    { urls: 'stun:stun1.l.google.com:19302' }
                ]
            }
        };

        function requestNotificationPermission() {
            if ("Notification" in window && Notification.permission !== "granted" && Notification.permission !== "denied") {
                Notification.requestPermission();
            }
        }

        function sendOSNotification(title, body) {
            if ("Notification" in window && Notification.permission === "granted" && document.hidden) {
                new Notification(title, { body: body });
            }
        }

        function updateStatus(text, colorClass) {
            document.getElementById('status-text').innerText = text;
            document.getElementById('status-dot').className = `w-2.5 h-2.5 rounded-full ${colorClass}`;
        }

        function joinServer(code) {
            const name = document.getElementById('username-input').value.trim();
            if (!name) { alert('Please enter your name.'); return; }
            myUsername = name;
            roomCode = code.toUpperCase();
            requestNotificationPermission();
            initConnection();
        }

        function joinPrivateRoom() {
            const code = document.getElementById('room-code-input').value.trim();
            if (!code) { alert('Please enter a Room Code.'); return; }
            joinServer(code);
        }

        function getTargetHostId() {
            return `falconchat-${roomCode}-host`;
        }

        function initConnection() {
            updateStatus('Connecting...', 'bg-yellow-400 animate-pulse');
            const targetHostId = getTargetHostId();
            peer = new Peer(targetHostId, peerConfig);

            peer.on('open', (id) => {
                isHost = true;
                updateStatus('Connected (Host)', 'bg-emerald-400 shadow-[0_0_8px_#34d399]');
                transitionToChatUI();
                participantNames[peer.id] = myUsername;
                addSystemMessage(`Room created successfully.`);
                updatePeerListUI();
                setupHostListeners();
                setupVideoListeners();
            });

            peer.on('error', (err) => {
                if (err.type === 'unavailable-id') {
                    peer.destroy();
                    connectAsClient(targetHostId);
                } else {
                    console.error(err);
                    updateStatus('Connection Error', 'bg-red-500');
                }
            });
        }

        function connectAsClient(hostId) {
            isHost = false;
            peer = new Peer(undefined, peerConfig);

            peer.on('open', (id) => {
                updateStatus('Joining...', 'bg-yellow-400');
                const conn = peer.connect(hostId, { metadata: { username: myUsername } });
                setupClientConnection(conn);
                setupVideoListeners();
            });

            peer.on('error', (err) => {
                console.error(err);
                updateStatus('Failed to join', 'bg-red-500');
                alert('Could not connect. Verify the room code and ensure the host is online.');
            });
        }

        function setupClientConnection(conn) {
            hostConnection = conn;
            conn.on('open', () => {
                updateStatus('Connected', 'bg-emerald-400 shadow-[0_0_8px_#34d399]');
                transitionToChatUI();
                addSystemMessage(`Joined room: ${roomCode}`);
                conn.send({ type: 'handshake', username: myUsername });
            });
            conn.on('data', (data) => handleIncomingData(data));
            conn.on('close', () => {
                updateStatus('Disconnected', 'bg-red-500');
                addSystemMessage('The host has ended the session.');
                leaveRoom();
            });
        }

        function setupHostListeners() {
            peer.on('connection', (conn) => {
                connections[conn.peer] = conn;
                conn.on('data', (data) => {
                    if (data.type === 'handshake') {
                        participantNames[conn.peer] = data.username;
                        broadcastParticipantList();
                        broadcastSystemMessage(`${data.username} joined the chat.`);
                    } else {
                        handleIncomingData(data);
                        broadcastToOthers(data, conn.peer);
                    }
                });
                conn.on('close', () => {
                    const leftName = participantNames[conn.peer] || 'Someone';
                    delete connections[conn.peer];
                    delete participantNames[conn.peer];
                    broadcastParticipantList();
                    broadcastSystemMessage(`${leftName} left the chat.`);
                    removeVideoStream(conn.peer);
                });
            });
        }

        function broadcastToOthers(data, senderPeerId) {
            Object.keys(connections).forEach(pId => {
                if (pId !== senderPeerId) connections[pId].send(data);
            });
        }

        function broadcastSystemMessage(text) {
            addSystemMessage(text);
            const payload = { type: 'system', message: text };
            Object.values(connections).forEach(conn => conn.send(payload));
        }

        function broadcastParticipantList() {
            const listPayload = { type: 'participants', names: participantNames };
            updatePeerListUI();
            Object.values(connections).forEach(conn => conn.send(listPayload));
        }

        function handleIncomingData(data) {
            if (data.type === 'chat' || data.type === 'image') {
                renderMessageBubble(data, false);
                sendOSNotification(`New message from ${data.username}`, data.type === 'image' ? '[Image]' : data.message);
            } else if (data.type === 'system') {
                addSystemMessage(data.message);
            } else if (data.type === 'participants') {
                participantNames = data.names;
                updatePeerListUI();
            }
        }

        function setupVideoListeners() {
            peer.on('call', (call) => {
                call.answer(localStream);
                call.on('stream', (remoteStream) => {
                    if (!document.getElementById(`video-${call.peer}`)) {
                        const callerName = participantNames[call.peer] || call.metadata?.username || 'Guest';
                        addVideoStream(call.peer, remoteStream, callerName);
                    }
                });
                call.on('close', () => removeVideoStream(call.peer));
                activeCalls[call.peer] = call;
            });
        }

        async function toggleVideo() {
            const btn = document.getElementById('video-btn');
            if (localStream) {
                localStream.getTracks().forEach(track => track.stop());
                localStream = null;
                removeVideoStream('local');
                Object.values(activeCalls).forEach(call => call.close());
                activeCalls = {};
                btn.className = "bg-white/10 hover:bg-white/20 p-3 rounded-xl border border-white/10 transition text-gray-300 hover:text-white";
            } else {
                try {
                    localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
                    addVideoStream('local', localStream, 'You', true);
                    btn.className = "bg-red-500 text-white p-3 rounded-xl border border-red-400 transition shadow-lg shadow-red-500/30";
                    
                    Object.keys(participantNames).forEach(peerId => {
                        if (peerId !== peer.id) {
                            const call = peer.call(peerId, localStream, { metadata: { username: myUsername } });
                            call.on('stream', (remoteStream) => {
                                if (!document.getElementById(`video-${call.peer}`)) {
                                    addVideoStream(call.peer, remoteStream, participantNames[call.peer]);
                                }
                            });
                            call.on('close', () => removeVideoStream(call.peer));
                            activeCalls[call.peer] = call;
                        }
                    });
                } catch (err) {
                    console.error('Camera/Mic Permission Error:', err);
                    alert('Camera and microphone access is required for video calls. Please check your browser permissions and ensure no other app is using your camera.');
                }
            }
        }

        function addVideoStream(peerId, stream, name, isLocal = false) {
            const gridContainer = document.getElementById('video-grid-container');
            const grid = document.getElementById('video-grid');
            gridContainer.classList.remove('hidden');

            const wrapper = document.createElement('div');
            wrapper.id = `video-${peerId}`;
            wrapper.className = "relative flex-shrink-0 w-64 h-48 bg-black/50 rounded-2xl overflow-hidden border border-white/10 snap-center shadow-lg";
            
            const video = document.createElement('video');
            video.srcObject = stream;
            video.autoplay = true;
            video.className = "w-full h-full object-cover";
            if (isLocal) {
                video.muted = true;
                video.classList.add('transform', 'scale-x-[-1]'); 
            }

            const label = document.createElement('div');
            label.className = "absolute bottom-2 left-2 bg-black/60 backdrop-blur-sm text-white text-xs font-semibold px-2 py-1 rounded-md";
            label.innerText = name;

            wrapper.appendChild(video);
            wrapper.appendChild(label);
            grid.appendChild(wrapper);
        }

        function removeVideoStream(peerId) {
            const el = document.getElementById(`video-${peerId}`);
            if (el) el.remove();
            if (document.getElementById('video-grid').children.length === 0) {
                document.getElementById('video-grid-container').classList.add('hidden');
            }
        }

        function handleSendText(e) {
            e.preventDefault();
            const input = document.getElementById('message-input');
            const text = input.value.trim();
            if (!text) return;

            const payload = { type: 'chat', username: myUsername, message: text, time: getTime() };
            renderMessageBubble(payload, true);
            dispatchPayload(payload);
            input.value = '';
        }

        function previewImage(e) {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(event) {
                stagedImageBase64 = event.target.result;
                document.getElementById('modal-img-preview').src = stagedImageBase64;
                document.getElementById('image-caption-input').value = '';
                document.getElementById('image-modal').classList.remove('hidden');
            };
            reader.readAsDataURL(file);
            e.target.value = '';
        }

        function closeImageModal() {
            document.getElementById('image-modal').classList.add('hidden');
            stagedImageBase64 = null;
        }

        function handleSendImage() {
            if (!stagedImageBase64) return;
            const caption = document.getElementById('image-caption-input').value.trim();
            const payload = { type: 'image', username: myUsername, image: stagedImageBase64, caption: caption, time: getTime() };
            renderMessageBubble(payload, true);
            dispatchPayload(payload);
            closeImageModal();
        }

        function dispatchPayload(payload) {
            if (isHost) {
                Object.values(connections).forEach(conn => conn.send(payload));
            } else if (hostConnection && hostConnection.open) {
                hostConnection.send(payload);
            }
        }

        function getTime() {
            return new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
        }

        function renderMessageBubble(data, isSelf) {
            const container = document.getElementById('message-container');
            const bubble = document.createElement('div');
            const timeStr = data.time || getTime();

            if (data.type === 'chat') {
                bubble.className = `flex flex-col space-y-1 ${isSelf ? 'items-end' : 'items-start'}`;
                bubble.innerHTML = `
                    <div class="flex items-baseline space-x-2">
                        ${isSelf ? `<span class="text-xs text-gray-500 font-medium">${timeStr}</span><span class="font-semibold text-purple-400 text-sm">You</span>` : `<span class="font-semibold text-blue-400 text-sm">${escapeHtml(data.username)}</span><span class="text-xs text-gray-500 font-medium">${timeStr}</span>`}
                    </div>
                    <div class="${isSelf ? 'bg-gradient-to-r from-blue-600 to-purple-600 text-white shadow-lg shadow-purple-500/20' : 'bg-white/10 backdrop-blur-md border border-white/5 text-gray-100 shadow-lg'} px-4 py-2.5 rounded-2xl max-w-lg text-sm">${escapeHtml(data.message)}</div>
                `;
            } else if (data.type === 'image') {
                bubble.className = `flex flex-col space-y-1 ${isSelf ? 'items-end' : 'items-start'}`;
                bubble.innerHTML = `
                    <div class="flex items-baseline space-x-2">
                        ${isSelf ? `<span class="text-xs text-gray-500 font-medium">${timeStr}</span><span class="font-semibold text-purple-400 text-sm">You</span>` : `<span class="font-semibold text-blue-400 text-sm">${escapeHtml(data.username)}</span><span class="text-xs text-gray-500 font-medium">${timeStr}</span>`}
                    </div>
                    <div class="bg-black/40 border border-white/10 p-2 rounded-2xl max-w-xs space-y-2 backdrop-blur-sm">
                        <img src="${data.image}" class="w-full rounded-xl object-cover">
                        ${data.caption ? `<p class="text-gray-200 text-sm px-2 pb-1">${escapeHtml(data.caption)}</p>` : ''}
                    </div>
                `;
            }
            container.appendChild(bubble);
            container.scrollTop = container.scrollHeight;
        }

        function addSystemMessage(text) {
            const container = document.getElementById('message-container');
            const note = document.createElement('div');
            note.className = "flex justify-center my-4";
            note.innerHTML = `<span class="text-xs bg-white/5 text-gray-400 px-4 py-1.5 rounded-full border border-white/10 backdrop-blur-sm">${text}</span>`;
            container.appendChild(note);
            container.scrollTop = container.scrollHeight;
        }

        function updatePeerListUI() {
            const list = document.getElementById('peer-list');
            list.innerHTML = '';
            Object.keys(participantNames).forEach((pId) => {
                const name = participantNames[pId];
                const isMe = pId === peer.id;
                list.innerHTML += `
                    <div class="flex items-center space-x-3 px-3 py-2 bg-white/5 rounded-xl border border-white/5">
                        <div class="w-2 h-2 rounded-full ${isMe ? 'bg-purple-500 shadow-[0_0_8px_#a855f7]' : 'bg-gray-400'}"></div>
                        <span class="text-sm font-medium text-gray-200 truncate">${escapeHtml(name)} ${isMe ? '(You)' : ''}</span>
                    </div>
                `;
            });
        }

        function transitionToChatUI() {
            document.getElementById('lobby-view').classList.add('hidden');
            document.getElementById('chat-view').classList.remove('hidden');
            document.getElementById('current-room-title').innerText = roomCode === 'PUBLIC-HUB' ? 'Public' : `Room: ${roomCode}`;
        }

        function leaveRoom() {
            if (localStream) {
                localStream.getTracks().forEach(track => track.stop());
                localStream = null;
            }
            Object.values(activeCalls).forEach(call => call.close());
            activeCalls = {};
            document.getElementById('video-grid').innerHTML = '';
            document.getElementById('video-grid-container').classList.add('hidden');
            
            if (peer) peer.destroy();
            connections = {};
            participantNames = {};
            hostConnection = null;
            
            document.getElementById('chat-view').classList.add('hidden');
            document.getElementById('lobby-view').classList.remove('hidden');
            document.getElementById('message-container').innerHTML = '';
            updateStatus('Disconnected', 'bg-gray-500');
        }

        function escapeHtml(text) {
            return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }
    </script>
</body>
</html>
